{{/* Default Helm values for the app */}}
{{/* See schema for the appropriate app version here https://github.com/giantswarm/karpenter-app/blob/main/helm/karpenter-bundle/values.schema.json */}}
{{- define "defaultKarpenterHelmValues" }}
clusterID: {{ include "resource.default.name" $ }}
region: {{ include "aws-region" $ }}
nodeIamRole:
  {{/* EKS has no worker instance profile to reuse, so the bundle creates one for karpenter nodes */}}
  create: true
{{- if (.Values.global.connectivity.proxy).enabled }}
proxy:
  noProxy: "{{ include "cluster.connectivity.proxy.noProxy" (dict "global" $.Values.global "providerIntegration" $.Values.cluster.providerIntegration) }}"
  http: {{ .Values.global.connectivity.proxy.httpProxy | quote }}
  https: {{ .Values.global.connectivity.proxy.httpsProxy | quote }}
{{- end }}
controller:
  image:
    repository: {{ include "awsContainerImageRegistry" $ }}/giantswarm/karpenter-controller
nodeSelector:
  {{- include "karpenter-host-node-selector" $ | nindent 2 }}
podLogs:
  enabled: {{ $.Values.cluster.providerIntegration.apps.observabilityBundle.enable }}
  tenant: "giantswarm"
serviceMonitor:
  enabled: {{ $.Values.cluster.providerIntegration.apps.observabilityBundle.enable }}
global:
  podSecurityStandards:
    {{/* PolicyException CRD only available with security-bundle installed */}}
    enforced: {{ and .Values.global.podSecurityStandards.enforced $.Values.cluster.providerIntegration.apps.securityBundle.enable }}
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "resource.default.name" $ }}-karpenter-bundle
  namespace: {{ $.Release.Namespace }}
  annotations:
    cluster.giantswarm.io/description: "{{ .Values.global.metadata.description }}"
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    {{- include "labels.common" . | nindent 4 }}
spec:
  releaseName: {{ include "resource.default.name" $ }}-karpenter-bundle
  targetNamespace: {{ $.Release.Namespace | quote }}
  storageNamespace: {{ $.Release.Namespace | quote }}
  chart:
    spec:
      chart: karpenter-bundle
      {{- $_ := set $ "appName" "karpenter" }}
      version: {{ include "cluster.app.version" $ }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "resource.default.name" $ }}-{{ include "cluster.app.catalog" $ }}
  serviceAccountName: automation
  interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  {{- $karpenterHelmValues := (include "defaultKarpenterHelmValues" .) | fromYaml -}}
  {{- $customKarpenterHelmValues := ((($.Values.global).apps).karpenter).values -}}
  {{- if $customKarpenterHelmValues }}
  {{- $karpenterHelmValues = merge (deepCopy $customKarpenterHelmValues) $karpenterHelmValues -}}
  {{- end }}
  {{- if $karpenterHelmValues }}
  values: {{- $karpenterHelmValues | toYaml | nindent 4 }}
  {{- end }}
  {{- if ((($.Values.global).apps).karpenter).extraConfigs }}
  valuesFrom:
    {{- range $config := ((($.Values.global).apps).karpenter).extraConfigs }}
    - kind: {{ $config.kind }}
      name: {{ $config.name }}
      valuesKey: values
      optional: {{ $config.optional | default false  }}
    {{- end }}
  {{- end }}
