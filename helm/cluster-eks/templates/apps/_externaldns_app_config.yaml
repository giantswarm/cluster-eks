{{/* EKS-specific external-dns Helm values*/}}
{{- define "EKSExternalDNSHelmValues" }}
provider: aws
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:{{ include "aws-partition" $ }}:iam::{{ include "aws-account-id" $ }}:role/{{ include "resource.default.name" $ }}-external-dns
txtOwnerId: giantswarm-io-external-dns
txtPrefix: "{{ .Values.global.metadata.name }}"
sources:
  - service
extraArgs:
  - "--aws-batch-change-interval=10s"
{{- end }}
